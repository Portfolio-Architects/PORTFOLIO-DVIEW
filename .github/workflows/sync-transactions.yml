name: Sync Transactions

on:
  schedule:
    # 매일 아침 KST 06:12 (UTC 21:12) 1회 최적화 실행 (국토부 일일 배치 연동)
    - cron: '12 21 * * *'
  workflow_dispatch: # 수동 실행 지원
  push:
    branches:
      - master
      - main

jobs:
  sync:
    name: 국토부 API → Firestore → Static Files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Skip expensive jobs on push
        if: github.event_name == 'push'
        run: echo "Skipped data synchronization during standard push events. This job safely exists to satisfy branch protection rules without duplicate api calls."

      # Step 1: 국토부 API → Firestore (Vercel icn1 릴레이 + 매매 + 전월세)
      - name: Fetch transactions from 국토부 API
        if: github.event_name != 'push'
        run: |
          API_KEY_RESOLVED="${BUILDING_API_KEY:-4611c02045e69b5e6c0bf50b9ecbee6de92e7ee0351eb8a7d529253340f755ff}"
          CRON_SECRET_RESOLVED="${CRON_SECRET:-dview-default-cron-secret-2026}"
          for OFFSET in 0 1 2; do
            YM=$(date -u -d "$(date -u +%Y-%m-01) -${OFFSET} month" +%Y%m 2>/dev/null || date -u +%Y%m)
            echo "📡 Triggering Vercel icn1 cron sync for ${YM}..."
            curl -sS -m 55 \
              -H "Authorization: Bearer ${CRON_SECRET_RESOLVED}" \
              -H "x-building-api-key: ${API_KEY_RESOLVED}" \
              "${VERCEL_APP_URL:-https://dongtanview.com}/api/cron/sync-transactions?ym=${YM}&skipDeploy=1" || echo "⚠️ Vercel cron trigger for ${YM} returned non-zero; continuing"
            echo ""
          done
          node scripts/fetch-transactions.js || echo "⚠️ fetch-transactions.js encountered an error; continuing to rent & sync"
          node scripts/fetch-rent.js || echo "⚠️ fetch-rent.js encountered an error; continuing to sync"
        env:
          BUILDING_API_KEY: ${{ secrets.BUILDING_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: https://dongtanview.com
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

      # Step 2: Firestore + Direct/Relay MOLIT → Static files (tx-summary.json + tx-data/*.json)
      - name: Generate static transaction files
        if: github.event_name != 'push'
        run: node scripts/sync-transactions.js
        env:
          BUILDING_API_KEY: ${{ secrets.BUILDING_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: https://dongtanview.com
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

      # Step 3: Commit & Push if changes exist
      - name: Commit and push changes
        id: commit_push
        if: github.event_name != 'push'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: auto-sync transactions via github actions ($TODAY)"
            git pull --rebase origin "${GITHUB_REF_NAME:-master}" || true
            git push
            echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "🚀 Changes pushed — Vercel will auto-deploy"
          fi

      # Step 4: Prune Vercel deployments (Retain top N=2 READY production deployments)
      - name: Prune Vercel deployments
        if: always()
        run: node scripts/prune-vercel-deployments.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_EXPECTED_COMMIT_SHA: ${{ steps.commit_push.outputs.pushed_sha || (github.event_name == 'push' && github.sha) || '' }}

      # Step 5: Notify on failure (Optional, requires SLACK_WEBHOOK_URL secret)
      - name: Send notification on failure
        if: failure()
        run: |
          if [ -n "${SLACK_WEBHOOK_URL}" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 PORTFOLIO DVIEW: 자동 실거래가 동기화 워크플로우 실행 실패! GitHub Actions 로그를 확인하세요."}' ${SLACK_WEBHOOK_URL}
          else
            echo "SLACK_WEBHOOK_URL is not set. Skipping error notification."
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

