name: Sync Transactions

on:
  schedule:
    # [Tier 1] 매일 05:38 KST (UTC 20:38) — 1차 조기 수집 (국토부 일일 배치 안착 직후)
    - cron: '38 20 * * *'
    # [Tier 2] 매일 06:18 KST (UTC 21:18) — 2차 보정 및 지연 캐치업 (1차 누락/장애 시 자동 구제)
    - cron: '18 21 * * *'
    # [Tier 3] 매일 06:38 KST (UTC 21:38) — 3차 최종 비상 안전망 (07:00 마감 전 22분 완충 버퍼 확보)
    - cron: '38 21 * * *'
  workflow_dispatch: # 긴급 수동 동기화 지원
  push:
    branches:
      - master
      - main

env:
  TZ: 'Asia/Seoul' # [중요] 한국 표준시 고정으로 매월 1일 및 요일 경계선 버그 원천 방지

concurrency:
  group: sync-transactions-production
  cancel-in-progress: false # 데이터 무결성을 위해 진행 중인 배치는 끝까지 완료 보장

jobs:
  sync:
    name: 국토부 API → Firestore → Static Data Files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: 'Asia/Seoul' # [중요] 한국 표준시 고정으로 매월 1일 및 요일 경계선 버그 원천 방지
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      # Step 0: 오전 05:00~07:29 KST 전용 게이트 (GitHub Actions 큐 지연으로 08~12시·11:00 KST에 실행되는 중복 크롤링·자동 커밋·2차 Vercel 재배포 원천 차단)
      - name: Morning-only KST Schedule Gate (Skip Delayed Daytime Runs)
        id: schedule_gate
        working-directory: .
        run: |
          EVENT_NAME="${{ github.event_name }}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_crawl=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=none" >> "$GITHUB_OUTPUT"
            echo "Manual workflow_dispatch requested — proceeding with sync"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            echo "should_crawl=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=push_event" >> "$GITHUB_OUTPUT"
            echo "Push event — skipping scheduled crawl"
            exit 0
          fi

          KST_HHMM_RAW=$(TZ='Asia/Seoul' date +%H%M)
          KST_HHMM=$((10#${KST_HHMM_RAW}))
          TODAY_YMD=$(TZ='Asia/Seoul' date +%Y%m%d)

          # Strict early-morning KST window: 05:00 <= KST < 07:30 (prevents delayed ~11:00 KST crawling & 2nd deploy)
          if [ "$KST_HHMM" -lt 500 ] || [ "$KST_HHMM" -ge 730 ]; then
            echo "should_crawl=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=outside_morning_window" >> "$GITHUB_OUTPUT"
            echo "Skipping delayed schedule run at ${KST_HHMM_RAW} KST (allowed early-morning window: 05:00~07:29 KST only)"
            exit 0
          fi

          # Same-day production check: if 05:35/06:15 Vercel Cron + Deploy Hook already published today's batch, skip redundant crawl
          # Cache-bust query + headers bypass /data/:path* public max-age=900 CDN caching
          CACHE_BUST=$(date +%s)
          LIVE_JSON=$(curl -fsS --max-time 5 -H "Cache-Control: no-cache" -H "Pragma: no-cache" "https://dongtanview.com/data/market-stats.json?t=${CACHE_BUST}" 2>/dev/null || echo "")
          LIVE_REG_DATE=$(printf '%s\n' "$LIVE_JSON" | tr '\r\n' ' ' | sed -n 's/.*"latestRegisteredDate"[[:space:]]*:[[:space:]]*"\([0-9]\{8\}\)".*/\1/p')
          if [ -n "$LIVE_REG_DATE" ] && [ "$LIVE_REG_DATE" = "$TODAY_YMD" ]; then
            echo "should_crawl=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=already_live_today" >> "$GITHUB_OUTPUT"
            echo "Production already reflects today's MOLIT batch (${TODAY_YMD}) via Vercel morning cron — skipping redundant GitHub Actions crawl"
            exit 0
          fi

          echo "should_crawl=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=none" >> "$GITHUB_OUTPUT"
          echo "Early-morning recovery window active (${KST_HHMM_RAW} KST, live latestRegisteredDate=${LIVE_REG_DATE:-unknown}) — proceeding with sync"

      - name: Checkout
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_crawl == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master # 큐 대기로 지연된 2차 티어가 1차 푸시 커밋을 최신화하여 가져오도록 보장
          fetch-depth: 2

      - name: Setup Node.js
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_crawl == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_crawl == 'true'
        run: npm ci

      - name: Skip expensive jobs on push
        if: github.event_name == 'push'
        run: echo "Skipped data synchronization during standard push events. This job safely exists to satisfy branch protection rules without duplicate api calls."

      # Step 1: 국토부 API → Firestore (평일 2개월 증분, 일요일 4개월 딥 싱크)
      # Note: Direct runner sync replaces pre-loop curl to /api/cron/sync-transactions?ym=${YM}&skipDeploy=1 to prevent duplicate Vercel Fluid CPU execution
      - name: Fetch transactions from 국토부 API
        if: github.event_name != 'push' && steps.schedule_gate.outputs.should_crawl == 'true'
        run: |
          node scripts/fetch-transactions.js
          node scripts/fetch-rent.js
        env:
          BUILDING_API_KEY: ${{ secrets.BUILDING_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: https://dongtanview.com
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

      # Step 2: Firestore → 정적 파일 생성 (실데이터 기준 이중 서킷 브레이커 내장)
      - name: Generate static transaction files
        if: github.event_name != 'push' && steps.schedule_gate.outputs.should_crawl == 'true'
        run: node scripts/sync-transactions.js
        env:
          SKIP_MOLIT_DIRECT_FETCH: 'true'
          BUILDING_API_KEY: ${{ secrets.BUILDING_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: https://dongtanview.com
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

      # Step 2.5: 제로 데이터 무결성 2차 파일 크기 방어
      - name: Verify data integrity before commit
        if: github.event_name != 'push' && steps.schedule_gate.outputs.should_crawl == 'true'
        run: |
          SIZE=$(wc -c < public/data/tx-summary.json || echo 0)
          if [ "$SIZE" -lt 50000 ]; then
            echo "🚨 치명적 무결성 오류: tx-summary.json 크기가 50KB 미만(${SIZE} bytes)입니다. Git 커밋을 중단합니다!"
            exit 1
          fi

      # Step 3: 변경사항 Git 커밋 & 푸시 (Asia/Seoul 기준 날짜 태깅 + 프로덕션 선반영 시 중복 재배포 원천 차단)
      - name: Commit and push changes
        id: commit_push
        if: github.event_name != 'push' && steps.schedule_gate.outputs.should_crawl == 'true'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date +%Y-%m-%d)
            TODAY_YMD=$(date +%Y%m%d)
            EVENT_NAME="${{ github.event_name }}"
            ALREADY_LIVE=$(TODAY_YMD="$TODAY_YMD" EVENT_NAME="$EVENT_NAME" node -e '
              (async () => {
                try {
                  if (process.env.EVENT_NAME === "workflow_dispatch") return console.log("false");
                  const fs = require("fs");
                  const localStats = JSON.parse(fs.readFileSync("frontend/public/data/market-stats.json", "utf8"));
                  const localSummary = JSON.parse(fs.readFileSync("frontend/public/data/tx-summary.json", "utf8"));
                  const localRent = Object.values(localSummary.summary || {}).reduce((s, v) => s + (Number(v && v.rentTxCount) || 0), 0);
                  const ac = new AbortController();
                  const timer = setTimeout(() => ac.abort(), 8000);
                  const cb = Date.now();
                  const [sRes, tRes] = await Promise.all([
                    fetch(`https://dongtanview.com/data/market-stats.json?t=${cb}`, { signal: ac.signal, cache: "no-store", headers: { "Cache-Control": "no-cache" } }),
                    fetch(`https://dongtanview.com/data/tx-summary.json?t=${cb}`, { signal: ac.signal, cache: "no-store", headers: { "Cache-Control": "no-cache" } })
                  ]);
                  clearTimeout(timer);
                  if (!sRes.ok || !tRes.ok) return console.log("false");
                  const liveStats = await sRes.json();
                  const liveSummary = await tRes.json();
                  const liveRent = Object.values(liveSummary.summary || {}).reduce((s, v) => s + (Number(v && v.rentTxCount) || 0), 0);
                  const alreadySyncedToday =
                    Boolean(process.env.TODAY_YMD) &&
                    liveStats.latestRegisteredDate === process.env.TODAY_YMD;
                  const upToDate =
                    alreadySyncedToday ||
                    (liveStats.latestRegisteredDate === localStats.latestRegisteredDate &&
                      Number(liveStats.saleTxCount || 0) >= Number(localStats.saleTxCount || 0) &&
                      liveRent >= localRent);
                  console.log(upToDate ? "true" : "false");
                } catch {
                  console.log("false");
                }
              })();
            ')
            if [ "$ALREADY_LIVE" = "true" ]; then
              git reset --hard HEAD
              git clean -fd
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "✅ Production static files already reflect today's MOLIT batch — skipping redundant commit/push to preserve clean HEAD for Vercel Deploy Hooks"
            else
              git commit -m "data: auto-sync transactions via github actions ($TODAY)"
              git pull --rebase origin "${GITHUB_REF_NAME:-master}" || true
              git push
              echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "🚀 Changes pushed — Vercel auto-deployment triggered"
            fi
          fi

      # Step 3.5: 신규 실거래가 커밋 시 PWA 웹 푸시 알림 발송
      - name: Trigger PWA Push Notifications for New Transactions
        id: trigger_push_notifications
        if: github.event_name != 'push' && (steps.commit_push.outputs.has_changes == 'true' || steps.commit_push.outputs.pushed_sha != '')
        run: |
          APP_URL="${VERCEL_APP_URL:-https://dongtanview.com}"
          if [ -z "${CRON_SECRET}" ]; then
            echo "❌ CRON_SECRET GitHub Secret이 설정되지 않아 푸시 발송 API 호출을 중단합니다."
            exit 1
          fi
          CRON_AUTH="${CRON_SECRET}"
          TARGET_DATE=$(date +%Y%m%d)

          echo "📣 신규 실거래가 커밋 감지 (SHA: ${{ steps.commit_push.outputs.pushed_sha }})"
          echo "📡 푸시 발송 엔드포인트 호출 대상 일자: ${TARGET_DATE}"

          # 1순위: 로컬 runner CLI 스크립트가 존재할 경우 직접 실행 (Zero-delay, No Vercel cold-start)
          if [ -f "scripts/send-tx-notifications.js" ]; then
            echo "▶️ runner CLI 스크립트(scripts/send-tx-notifications.js) 직접 실행"
            node scripts/send-tx-notifications.js --date="${TARGET_DATE}" || echo "⚠️ 로컬 푸시 스크립트 경고 (엔드포인트 호출 지속)"
          elif [ -f "scripts/test-push-notification.js" ]; then
            echo "▶️ runner CLI 스크립트(scripts/test-push-notification.js --send) 직접 실행"
            node scripts/test-push-notification.js --send --date="${TARGET_DATE}" || echo "⚠️ 로컬 푸시 스크립트 경고 (엔드포인트 호출 지속)"
          fi

          # 2순위: 프로덕션 API 엔드포인트 트리거 (웹훅 기반 디스패치 및 구독자 전송)
          RESPONSE=$(curl -sS -m 45 -X GET \
            -H "Authorization: Bearer ${CRON_AUTH}" \
            "${APP_URL}/api/cron/send-tx-notifications?date=${TARGET_DATE}" || echo '{"error":"CURL_TRIGGER_NOTICE"}')

          echo "✅ 푸시 발송 API 응답: ${RESPONSE}"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: https://dongtanview.com
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      # Step 4: Vercel 배포 정리 (최신 배포 2개 유지 — 실제 크롤링/동기화 수행 시에만 실행)
      - name: Prune Vercel deployments
        if: always() && github.event_name != 'push' && steps.schedule_gate.outputs.should_crawl == 'true'
        run: node scripts/prune-vercel-deployments.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_EXPECTED_COMMIT_SHA: ${{ steps.commit_push.outputs.pushed_sha || '' }}

      # Step 4.5: 프로덕션 Sitemap 카나리 헬스체크 (실제 배포 발생 시에만 최소 경로 검증)
      - name: Warm up Sitemap SSR/ISR Edge Cache
        if: always() && (steps.commit_push.outputs.pushed_sha != '' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[vercel skip]') && !contains(github.event.head_commit.message, '[skip ci]')))
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- . ':!*.test.*' ':!*.spec.*'; then
              echo "Skipped warmup: no non-test frontend changes (Vercel ignoreCommand skipped deployment)"
              exit 0
            fi
          fi
          node scripts/warm-sitemap-cache.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_APP_URL: https://dongtanview.com
          VERCEL_EXPECTED_COMMIT_SHA: ${{ steps.commit_push.outputs.pushed_sha || github.sha }}

      # Step 5: 실패 시 다채널 장애 통지 (Discord & Slack 듀얼 호환)
      - name: Send notification on failure
        if: failure()
        working-directory: .
        run: |
          WEBHOOK_URL="${DISCORD_WEBHOOK_URL:-$SLACK_WEBHOOK_URL}"
          if [ -n "${WEBHOOK_URL}" ]; then
            # Discord 웹훅 URL인 경우 /slack 접미사 부착으로 슬랙 포맷 완벽 호환
            if [[ "$WEBHOOK_URL" == *"discord.com/api/webhooks"* && "$WEBHOOK_URL" != *"/slack" ]]; then
              WEBHOOK_URL="${WEBHOOK_URL}/slack"
            fi
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"content\":\"🚨 [D-VIEW] 실거래가 자동 수집 실패! 확인: ${RUN_URL}\",\"text\":\"🚨 [D-VIEW] 실거래가 자동 수집 실패! 점검 필요: ${RUN_URL}\"}" \
              "${WEBHOOK_URL}"
          else
            echo "DISCORD_WEBHOOK_URL / SLACK_WEBHOOK_URL is not set. Skipping error notification."
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
