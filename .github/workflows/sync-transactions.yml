name: Sync Transactions

on:
  schedule:
    # [Tier 1] 매일 05:38 KST (UTC 20:38) — 1차 조기 수집 (국토부 일일 배치 안착 직후)
    - cron: '38 20 * * *'
    # [Tier 2] 매일 06:18 KST (UTC 21:18) — 2차 보정 및 지연 캐치업 (1차 누락/장애 시 자동 구제)
    - cron: '18 21 * * *'
    # [Tier 3] 매일 06:38 KST (UTC 21:38) — 3차 최종 비상 안전망 (07:00 마감 전 22분 완충 버퍼 확보)
    - cron: '38 21 * * *'
  workflow_dispatch: # 긴급 수동 동기화 지원
  push:
    branches:
      - master
      - main

env:
  TZ: 'Asia/Seoul' # [중요] 한국 표준시 고정으로 매월 1일 및 요일 경계선 버그 원천 방지

concurrency:
  group: sync-transactions-production
  cancel-in-progress: false # 데이터 무결성을 위해 진행 중인 배치는 끝까지 완료 보장

jobs:
  sync:
    name: 국토부 API → Firestore → Static Data Files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: 'Asia/Seoul' # [중요] 한국 표준시 고정으로 매월 1일 및 요일 경계선 버그 원천 방지
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master # 큐 대기로 지연된 2차 티어가 1차 푸시 커밋을 최신화하여 가져오도록 보장
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Skip expensive jobs on push
        if: github.event_name == 'push'
        run: echo "Skipped data synchronization during standard push events. This job safely exists to satisfy branch protection rules without duplicate api calls."

      # Step 1: 국토부 API → Firestore (평일 2개월 증분, 일요일 4개월 딥 싱크)
      # Note: Direct runner sync replaces pre-loop curl to /api/cron/sync-transactions?ym=${YM}&skipDeploy=1 to prevent duplicate Vercel Fluid CPU execution
      - name: Fetch transactions from 국토부 API
        if: github.event_name != 'push'
        run: |
          node scripts/fetch-transactions.js
          node scripts/fetch-rent.js
        env:
          BUILDING_API_KEY: ${{ secrets.BUILDING_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: https://dongtanview.com
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

      # Step 2: Firestore → 정적 파일 생성 (실데이터 기준 이중 서킷 브레이커 내장)
      - name: Generate static transaction files
        if: github.event_name != 'push'
        run: node scripts/sync-transactions.js
        env:
          SKIP_MOLIT_DIRECT_FETCH: 'true'
          BUILDING_API_KEY: ${{ secrets.BUILDING_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: https://dongtanview.com
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}

      # Step 2.5: 제로 데이터 무결성 2차 파일 크기 방어
      - name: Verify data integrity before commit
        if: github.event_name != 'push'
        run: |
          SIZE=$(wc -c < public/data/tx-summary.json || echo 0)
          if [ "$SIZE" -lt 50000 ]; then
            echo "🚨 치명적 무결성 오류: tx-summary.json 크기가 50KB 미만(${SIZE} bytes)입니다. Git 커밋을 중단합니다!"
            exit 1
          fi

      # Step 3: 변경사항 Git 커밋 & 푸시 (Asia/Seoul 기준 날짜 태깅)
      - name: Commit and push changes
        id: commit_push
        if: github.event_name != 'push'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: auto-sync transactions via github actions ($TODAY)"
            git pull --rebase origin "${GITHUB_REF_NAME:-master}" || true
            git push
            echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Changes pushed — Vercel auto-deployment triggered"
          fi

      # Step 3.5: 신규 실거래가 커밋 시 PWA 웹 푸시 알림 발송
      - name: Trigger PWA Push Notifications for New Transactions
        id: trigger_push_notifications
        if: github.event_name != 'push' && (steps.commit_push.outputs.has_changes == 'true' || steps.commit_push.outputs.pushed_sha != '')
        run: |
          APP_URL="${VERCEL_APP_URL:-https://dongtanview.com}"
          CRON_AUTH="${CRON_SECRET:-dview-default-cron-secret-2026}"
          TARGET_DATE=$(date +%Y%m%d)

          echo "📣 신규 실거래가 커밋 감지 (SHA: ${{ steps.commit_push.outputs.pushed_sha }})"
          echo "📡 푸시 발송 엔드포인트 호출 대상 일자: ${TARGET_DATE}"

          # 1순위: 로컬 runner CLI 스크립트가 존재할 경우 직접 실행 (Zero-delay, No Vercel cold-start)
          if [ -f "scripts/send-tx-notifications.js" ]; then
            echo "▶️ runner CLI 스크립트(scripts/send-tx-notifications.js) 직접 실행"
            node scripts/send-tx-notifications.js --date="${TARGET_DATE}" || echo "⚠️ 로컬 푸시 스크립트 경고 (엔드포인트 호출 지속)"
          elif [ -f "scripts/test-push-notification.js" ]; then
            echo "▶️ runner CLI 스크립트(scripts/test-push-notification.js --send) 직접 실행"
            node scripts/test-push-notification.js --send --date="${TARGET_DATE}" || echo "⚠️ 로컬 푸시 스크립트 경고 (엔드포인트 호출 지속)"
          fi

          # 2순위: 프로덕션 API 엔드포인트 트리거 (웹훅 기반 디스패치 및 구독자 전송)
          RESPONSE=$(curl -sS -m 45 -X GET \
            -H "Authorization: Bearer ${CRON_AUTH}" \
            "${APP_URL}/api/cron/send-tx-notifications?date=${TARGET_DATE}" || echo '{"error":"CURL_TRIGGER_NOTICE"}')

          echo "✅ 푸시 발송 API 응답: ${RESPONSE}"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: https://dongtanview.com
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      # Step 4: Vercel 배포 정리 (최신 배포 2개 유지)
      - name: Prune Vercel deployments
        if: always() && github.event_name != 'push'
        run: node scripts/prune-vercel-deployments.js
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_EXPECTED_COMMIT_SHA: ${{ steps.commit_push.outputs.pushed_sha || '' }}

      # Step 5: 실패 시 다채널 장애 통지 (Discord & Slack 듀얼 호환)
      - name: Send notification on failure
        if: failure()
        run: |
          WEBHOOK_URL="${DISCORD_WEBHOOK_URL:-$SLACK_WEBHOOK_URL}"
          if [ -n "${WEBHOOK_URL}" ]; then
            # Discord 웹훅 URL인 경우 /slack 접미사 부착으로 슬랙 포맷 완벽 호환
            if [[ "$WEBHOOK_URL" == *"discord.com/api/webhooks"* && "$WEBHOOK_URL" != *"/slack" ]]; then
              WEBHOOK_URL="${WEBHOOK_URL}/slack"
            fi
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"content\":\"🚨 [D-VIEW] 실거래가 자동 수집 실패! 확인: ${RUN_URL}\",\"text\":\"🚨 [D-VIEW] 실거래가 자동 수집 실패! 점검 필요: ${RUN_URL}\"}" \
              "${WEBHOOK_URL}"
          else
            echo "DISCORD_WEBHOOK_URL / SLACK_WEBHOOK_URL is not set. Skipping error notification."
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
